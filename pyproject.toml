[project]
name = "propiq-analytics"
version = "0.0.0"
description = "PropIQ Analytics — pre-game NBA player-prop research (RESEARCH_ONLY)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "pandas>=2.0",
    "numpy>=1.26",
    "scipy>=1.11",
    "rapidfuzz>=3.0",
    "python-dotenv>=1.0",
    "requests>=2.25.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pdfplumber>=0.11",
]
ml = [
    "xgboost>=2.0",
    "scikit-learn>=1.3",
    "catboost>=1.2",
    "PyYAML>=6.0",
    "typer>=0.12",
]
db = [
    "SQLAlchemy>=2.0.30",
    "psycopg[binary]>=3.1.18",
    "alembic>=1.13.0",
    "openpyxl>=3.1.0",
    "PyYAML>=6.0",
]
stats = [
    "nba_api>=1.4",
    "pyarrow>=14.0",
]
ui = [
    "streamlit>=1.28",
]
edge = [
    "nba-edge>=0.1.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
